name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: qmd-linux-amd64
            allow_failure: false
          - os: macos-latest
            asset_name: qmd-darwin-arm64
            allow_failure: false
          - os: macos-latest
            asset_name: qmd-darwin-amd64
            goarch: amd64
            # Cross-compiled from the arm64 runner: Xcode's clang ships both
            # arch slices, so `-arch x86_64` builds a real Intel binary
            # without needing a (now largely retired) Intel macOS runner.
            cc: "clang -arch x86_64"
            allow_failure: false
          - os: windows-latest
            asset_name: qmd-windows-amd64.exe
            # cgo needs a full sqlite3 dev toolchain (headers + import lib) on
            # MinGW, which isn't reliably available via a one-line package
            # install — best-effort only, doesn't gate the workflow.
            allow_failure: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # sqlite-vec-go-bindings (cgo) #includes "sqlite3.h" and expects it on
      # the system include path (it doesn't vendor its own copy); the
      # clipboard dependency (used by the chat TUI) needs X11 dev headers
      # on Linux. Neither ships on these runners by default.
      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libx11-dev

      - name: Install native build dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install sqlite --params "/NoTools" -y

      # sqlite-vec-go-bindings and mattn/go-sqlite3 use cgo; each OS builds
      # natively (no cross-compilation) so the platform C toolchain is used.
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist
          go build -tags sqlite_fts5 -o "dist/${{ matrix.asset_name }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v') && !failure()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifact dirs
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
